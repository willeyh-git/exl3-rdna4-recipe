network:
  host: 127.0.0.1
  port: 8096
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: ../models
  model_name: Ornith-1.5-35B-A3B-EXL3-4.00bpw-24GB
  backend: exllamav3
  max_seq_len: 7936
  cache_size: 8192
  cache_mode: Q4
  tensor_parallel: false
  gpu_split_auto: true
  autosplit_reserve: [768]
  cpu_moe_split_experts: 128
  max_batch_size: 1