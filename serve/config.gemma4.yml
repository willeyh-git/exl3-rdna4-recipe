network:
  host: 127.0.0.1
  port: 8096
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: ../models
  model_name: Gemma-4-26B-A4B-it-EXL3-4.10bpw
  backend: exllamav3
  max_seq_len: 7936
  cache_size: 8192
  cache_mode: Q4
  tensor_parallel: false
  gpu_split_auto: true
  autosplit_reserve: [768]
  chunk_size: 1024
  cpu_moe_split_experts: 64
  max_batch_size: 1
  vision: true
  vision_offload: true

draft_model:
  draft_mode: disabled

sampling:
  override_preset: safe_defaults